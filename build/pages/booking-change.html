<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ITB Transfer</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<style>
:root { --navy: #000000; --accent: #e1ad01; --ink: #0b1d30; --mute: #5b6678; --line: #e3e7ee; --bg: #eaf4f8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--navy); color: #fff; padding: 16px; border-bottom: 4px solid var(--accent); }
header a { color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; }
.wrap { max-width: 640px; margin: 0 auto; }
main { padding: 20px 16px 48px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 15px; margin: 0 0 4px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
.ref { color: var(--mute); margin: 0 0 14px; }
.quote { background: #f6f7fa; border-inline-start: 4px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 0 0 16px; white-space: pre-wrap; }
.q { font-weight: 700; margin: 6px 0 12px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 13px 22px; cursor: pointer; }
.yes { background: #16a34a; color: #fff; }
.no { background: #fff; color: var(--ink); border: 1px solid #c9d0dc; }
.pick { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: default; }
.msg { font-size: 17px; font-weight: 600; }
.ok::before { content: "✓ "; color: #16a34a; }
details summary { cursor: pointer; color: var(--mute); }
.foot { color: var(--mute); font-size: 13.5px; }
.err { color: #b91c1c; }
</style>
</head>
<body>
<header><div class="wrap"><a href="/">ITB Transfer</a></div></header>
<main class="wrap" id="main"><div class="card">…</div></main>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search), t = q.get("t") || "", pick = q.get("r");
  var main = document.getElementById("main");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function setLang(d) { document.documentElement.lang = d.lang || "en"; document.documentElement.dir = d.dir || "ltr"; if (d.text) document.title = d.text.pg_t + " | ITB Transfer"; }
  function note(d, key, cls) {
    main.innerHTML = '<div class="card"><p class="msg ' + (cls || "") + '">' + esc(d.text[key]) + '</p>' + (d.ref ? '<p class="ref">' + esc(d.ref) + '</p>' : '') + '<p class="foot">' + esc(d.text.foot) + '</p></div>';
  }
  // Nothing changes on opening the link (mail scanners open links too); the customer answers with a button
  function render(d) {
    setLang(d);
    if (d.state === "accepted") return note(d, "pg_ok", "ok");
    if (d.state === "declined") return note(d, "pg_dec");
    if (d.state === "confirmed") return note(d, "pg_conf", "ok");
    if (d.state !== "open") return note(d, "pg_bad");
    var T = d.text;
    main.innerHTML = '<div class="card"><h1>' + esc(T.pg_t) + '</h1><p class="ref">' + esc(d.ref) + '</p>' +
      (d.message ? '<div class="quote"><b>' + esc(T.note) + ':</b>\n' + esc(d.message) + '</div>' : '') +
      '<h2>' + esc(T.pg_new) + '</h2>' + d.proposed +
      '<p class="q" style="margin-top:20px">' + esc(T.pg_q) + '</p><div class="btns"><button type="button" class="yes' + (pick === "accept" ? " pick" : "") + '" data-a="accept">' + esc(T.acc) + '</button>' +
      '<button type="button" class="no' + (pick === "decline" ? " pick" : "") + '" data-a="decline">' + esc(T.dec) + '</button></div><p class="err" id="err" hidden></p></div>' +
      '<div class="card"><details><summary>' + esc(T.pg_cur) + '</summary>' + d.current + '</details></div><p class="foot">' + esc(T.foot) + '</p>';
    main.querySelectorAll("[data-a]").forEach(function (b) {
      b.addEventListener("click", function () {
        main.querySelectorAll("[data-a]").forEach(function (x) { x.disabled = true; });
        fetch("/api/respond", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t, answer: b.getAttribute("data-a") }) })
          .then(function (r) { return r.json().then(function (j) { if (!j.state) throw new Error(); render(j); }); })
          .catch(function () {
            var e = document.getElementById("err"); e.textContent = T.pg_err; e.hidden = false;
            main.querySelectorAll("[data-a]").forEach(function (x) { x.disabled = false; });
          });
      });
    });
  }
  fetch("/api/respond?t=" + encodeURIComponent(t)).then(function (r) { return r.json(); }).then(function (d) {
    if (d.text && !d.state) { d.state = "bad"; }
    if (!d.text) throw new Error();
    render(d);
  }).catch(function () { main.innerHTML = '<div class="card"><p class="msg">This link is no longer valid. Please contact us: +90 541 334 21 02</p></div>'; });
})();
</script>
</body>
</html>
