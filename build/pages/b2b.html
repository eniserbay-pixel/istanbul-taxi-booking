:root{--bg:#eaf4f8;--surface:#fff;--ink:#0d1b2a;--muted:#5a6778;--line:#dfe4ea;--navy:#000000;--navy-2:#2a2c30;--on-navy:#eef3f8;--on-navy-muted:#9db0c4;--accent:#e1ad01;--accent-soft:#fff4dc;--accent-text:#8a6a00;--go:#e1ad01;--go-hover:#c99a00;--go-soft:#fbf1cc;--ok:#1f8a5b;--err:#c0392b;--shadow:0 18px 40px -22px rgba(13,33,55,.45);--radius:14px;--font:"Noto Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
.top{background:var(--navy);color:var(--on-navy);border-bottom:4px solid var(--accent)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:800}
.brand img{height:34px;width:auto;display:block}
.badge{background:var(--accent);color:#1a1300;font-weight:800;font-size:12px;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.top .sp{flex:1}
.firm{color:var(--on-navy-muted);font-size:14px}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;color:var(--on-navy-muted);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600}
.tab.on{background:var(--navy-2);color:#fff}
.lang{display:flex;border:1px solid var(--navy-2);border-radius:9px;overflow:hidden}
.lang button{background:none;border:0;color:var(--on-navy-muted);padding:5px 9px;cursor:pointer;font-size:13px;font-weight:700}
.lang button.on{background:var(--navy-2);color:#fff}
.out{background:none;border:1px solid var(--navy-2);color:var(--on-navy);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:9px}
.card h2 .n{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:0 0 12px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 5px}
.fld{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.fld:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea.fld{min-height:70px;resize:vertical}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;margin:0 0 14px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.kinds{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.kind{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;cursor:pointer;font-weight:700;color:var(--muted)}
.kind svg{flex:none}
.kind.on{border-color:var(--navy);background:var(--navy);color:#fff}
.leg-h{font-weight:700;margin:6px 0 10px;font-size:14px;color:var(--navy-2)}
.cnt{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;min-height:44px;background:#fff}
.cnt button{width:42px;height:42px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--navy)}
.cnt b{flex:1;text-align:center}
.cars{display:grid;gap:10px}
.car{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:#fff;text-align:left;width:100%}
.car img{width:110px;height:62px;object-fit:contain;flex:none}
.car .t{flex:1;min-width:0}
.car .t b{display:block}
.car .t span{color:var(--muted);font-size:13px}
.car .p{font-weight:800;font-size:18px;white-space:nowrap}
.car.on{border-color:var(--go);background:var(--go-soft)}
.car[disabled]{opacity:.45;cursor:not-allowed}
.empty{color:var(--muted);padding:12px 0}
.pax{display:grid;grid-template-columns:28px 1.4fr 1fr 1fr;gap:10px;align-items:center;margin:0 0 10px}
.pax .i{font-weight:700;color:var(--muted);text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy)}
.note{background:var(--accent-soft);color:var(--accent-text);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.sum{position:sticky;top:16px}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin:14px 0 0;padding:14px 0 0}
.sum .tot b{font-size:24px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:46px}
.go{background:var(--go);color:#000;width:100%;margin:14px 0 0;font-size:16px}
.go:hover{background:var(--go-hover)}
.go[disabled]{opacity:.6;cursor:wait}
.err{background:#fdecea;color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.ok{background:var(--go-soft);color:var(--ok);border-radius:12px;padding:16px;margin:0 0 16px}
.login{max-width:400px;margin:40px auto}
.login .card{padding:26px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top}
.st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;background:#eef1f5;color:var(--muted);white-space:nowrap}
.st.talep,.st.degisiklik{background:var(--accent-soft);color:var(--accent-text)}
.st.onaylandi,.st.yeni,.st.tamamlandi{background:var(--go-soft);color:var(--ok)}
.st.reddedildi,.st.iptal{background:#fdecea;color:var(--err)}
.m{color:var(--muted)}
.scroll{overflow-x:auto}
.tbtn{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:space-between}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.tbtn.empty{color:var(--muted)}
.tbtn svg{flex:none;color:var(--muted)}
.twheel{position:absolute;z-index:60;width:220px;height:220px;display:grid;grid-template-columns:1fr 16px 1fr;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(13,27,42,.22);padding:0 8px;overflow:hidden}
.tw-band{position:absolute;left:8px;right:8px;top:88px;height:44px;background:var(--navy-2);border-radius:10px}
.tw-col{position:relative;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.tw-col::-webkit-scrollbar{display:none}
.tw-pad{height:88px}
.tw-it{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-weight:500;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.tw-it.on{color:#fff;font-weight:600}
.tw-sep{position:relative;text-align:center;color:#fff;font-weight:600;font-size:20px}
.filt{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px}
.filt .fld{width:auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:13px;font-weight:600}
.kpi b{display:block;font-size:22px;margin:4px 0 0;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.pos b{color:var(--ok)}.kpi.neg b{color:var(--err)}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.off td{color:var(--muted)}
.tbl tfoot td{font-weight:800;border-bottom:0}
.sale{width:96px;min-height:36px;padding:6px 8px;text-align:right}
.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-n{background:var(--navy);color:#fff}
.btn-sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:9px}
.pwbox{background:var(--go-soft);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.pwbox code{font-size:17px;font-weight:800;background:#fff;border-radius:7px;padding:2px 8px;user-select:all}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
@media (max-width:900px){.grid{grid-template-columns:1fr}.sum{position:static}}
@media (max-width:600px){.tabs{order:4;width:100%;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;padding:7px 10px}.kind{flex:1 1 0;justify-content:center;padding:10px 8px;font-size:14px;text-align:center}.pax{grid-template-columns:1fr}.pax .i{text-align:left}.car img{width:80px;height:46px}.top .in{gap:10px}.firm{order:5;width:100%}}
</style>
</head>

  function send() {

    var c = carOf(f.car);

        '<div><label class="f" for="ff">' + esc(t("dFrom")) + '</label><input class="fld" type="date" id="ff" value="' + esc(F.from) + '"></div>' +
        '<div><label class="f" for="ft">' + esc(t("dTo")) + '</label><input class="fld" type="date" id="ft" value="' + esc(F.to) + '"></div>' +
        '<span style="flex:1"></span><a class="btn btn-n" id="xl" href="/api/b2b?a=xlsx' + q + '" download><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>' + esc(t("xl")) + '</a></div>' +
      '<div class="kpis"><div class="kpi"><span>' + esc(t("kN")) + '</span><b>' + n + '</b></div>' +
        '<div class="kpi"><span>' + esc(t("kSale")) + '</span><b>' + sum("sale") + '</b>' + (noSale ? '<small>' + esc(t("kNoSale").replace("{n}", noSale)) + '</small>' : '') + '</div>' +
        '<div class="kpi"><span>' + esc(t("kCost")) + '</span><b>' + sum("cost") + '</b></div>' +
        '<div class="kpi ' + (profit > 0 ? "pos" : profit < 0 ? "neg" : "") + '"><span>' + esc(t("kProfit")) + '</span><b>' + sum("profit") + '</b></div>' +
        '<div class="kpi"><span>' + esc(t("kCash")) + '</span><b>' + cashTxt + '</b></div></div>' +
      (!rows.length ? '<div class="card"><p class="empty">' + esc(t("none")) + '</p></div>' :
      '<div class="card scroll"><table class="tbl"><thead><tr><th>' + esc(t("bRef")) + '</th><th>' + esc(t("bDate")) + '</th><th>' + esc(t("fType")) + ' · ' + esc(t("bRoute")) + '</th><th>' + esc(t("by")) + '</th><th>' + esc(t("bStatus")) + '</th><th>' + esc(t("fPay")) + '</th><th class="r">' + esc(t("fCost")) + '</th><th class="r">' + esc(t("fSale")) + '</th><th class="r">' + esc(t("fProfit")) + '</th></tr></thead><tbody>' +
      rows.map(function (b) {
        var c = b.legs.reduce(function (n, l) { return n + (+l.cash || 0); }, 0), pf = b.sale ? b.sale - b.total : null;
        var route = b.hourly ? esc(t("tHourly")) + ' · ' + esc(t("hrs").replace("{n}", b.hourly.hours)) + '<br><span class="m">' + esc((b.legs[0] || {}).fromName) + '</span>'
          : esc(t("tTransfer")) + '<br><span class="m">' + b.legs.map(function (l) { return esc(name(l.from, l.fromName)) + " → " + esc(name(l.to, l.toName)); }).join("<br>") + '</span>';
        return '<tr class="' + (OFF[b.status] ? "off" : "") + '"><td style="white-space:nowrap"><b>' + esc(b.ref || "#" + b.id) + '</b>' + (b.partnerRef ? '<br><span class="m">' + esc(b.partnerRef) + '</span>' : '') + '</td>' +
          '<td style="white-space:nowrap">' + b.legs.map(function (l) { return esc(l.date) + " " + esc(l.time); }).join("<br>") + '</td><td>' + route + '</td>' +
          '<td>' + esc(b.user || t("ownerL")) + '</td><td><span class="st ' + esc(b.status) + '">' + esc(t("st")[b.status] || b.status) + '</span></td>' +
          '<td style="white-space:nowrap">' + esc(t("pCari")) + (c ? '<br><span class="m">' + esc(t("pCash").replace("{a}", money(c, b.cashCur || b.currency))) + '</span>' : '') + '</td>' +
          '<td class="r">' + money(b.total, b.currency) + '</td>' +
          '<td class="r"><input class="fld sale" type="number" min="0" step="1" inputmode="decimal" data-sale="' + b.id + '" value="' + (b.sale || "") + '" placeholder="–" aria-label="' + esc(t("fSale")) + '"></td>' +
          '<td class="r" style="font-weight:700;color:' + (pf == null ? "inherit" : pf >= 0 ? "var(--ok)" : "var(--err)") + '">' + (pf == null ? '<span class="m">–</span>' : money(pf, b.currency)) + '</td></tr>';
      }).join("") + '</tbody><tfoot><tr><td colspan="6">' + esc(t("totals")) + '</td><td class="r">' + sum("cost") + '</td><td class="r">' + sum("sale") + '</td><td class="r">' + sum("profit") + '</td></tr></tfoot></table></div>');
    $("main").querySelectorAll("[data-pre]").forEach(function (b) { b.addEventListener("click", function () { var k = b.getAttribute("data-pre"), r = preset(k); S.fr = { p: k, from: r[0], to: r[1] }; drawFin(); }); });
    ["ff", "ft"].forEach(function (id) { $(id).addEventListener("change", function () { S.fr = { p: "", from: $("ff").value, to: $("ft").value }; drawFin(); }); });
    $("main").querySelectorAll("[data-sale]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = +el.getAttribute("data-sale");
        api("sale", { id: id, sale: +el.value || 0 }).then(function (j) {
          if (!j.booking) return;
          S.list.forEach(function (b, i) { if (b.id === id) S.list[i] = j.booking; });
          drawFin();
        });
      });
    });
  }

  // ---------- Kullanıcılar (the firm's owner): employees with their own user name and password ----------
  function drawUsers() {
    if (!S.users) {
      $("main").innerHTML = '<h1>' + esc(t("uTitle")) + '</h1><p class="m">…</p>';
      api("users").then(function (j) { S.users = j.users || []; if (S.tab === "users") drawUsers(); });
      return;
    }
    var dt = function (s) { return s ? new Date(s).toLocaleDateString(LOC[S.lang] || "en-GB") : ""; };
    $("main").innerHTML = '<h1>' + esc(t("uTitle")) + '</h1><p class="sub">' + esc(t("uSub")) + '</p>' +
      (S.pw ? '<div class="pwbox"><p style="margin:0 0 8px">' + esc(t("uPw").replace("{u}", S.pw.u)) + ' <code>' + esc(S.pw.p) + '</code></p><p class="m" style="margin:0;font-size:13.5px">' + esc(t("uPwNote")) + '</p></div>' : '') +
      '<section class="card"><h2>' + esc(t("uAdd")) + '</h2><div class="row">' +
        '<div><label class="f" for="un">' + esc(t("uName")) + '</label><input class="fld" id="un" maxlength="60" autocomplete="off"></div>' +
        '<div><label class="f" for="uu">' + esc(t("uUser")) + '</label><input class="fld" id="uu" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="' + esc(t("uEx")) + '"></div></div>' +
        '<label class="check"><input type="checkbox" id="uf"><span>' + esc(t("uFin")) + '</span></label>' +
        '<div class="err" id="uerr" hidden></div><button type="button" class="btn btn-n" id="uadd" style="margin:14px 0 0">' + esc(t("uAdd")) + '</button></section>' +
      '<section class="card scroll">' + (!S.users.length ? '<p class="empty">' + esc(t("uNone")) + '</p>' :
        '<table class="tbl"><thead><tr><th>' + esc(t("uName")) + '</th><th>' + esc(t("uUser")) + '</th><th>' + esc(t("uRole")) + '</th><th>' + esc(t("uSince")) + '</th><th></th></tr></thead><tbody>' +
        S.users.map(function (u) {
          return '<tr><td><b>' + esc(u.name) + '</b></td><td><code>' + esc(u.username) + '</code></td>' +
            '<td><label class="check" style="font-weight:500"><input type="checkbox" data-ufin="' + esc(u.id) + '"' + (u.fin ? " checked" : "") + '><span>' + esc(t(u.fin ? "uAll" : "uOwn")) + '</span></label></td>' +
            '<td class="m">' + dt(u.at) + '</td><td style="white-space:nowrap"><button type="button" class="btn btn-o btn-sm" data-upw="' + esc(u.id) + '">' + esc(t("uNew")) + '</button> <button type="button" class="btn btn-o btn-sm" data-udel="' + esc(u.id) + '" style="color:var(--err)">' + esc(t("uDel")) + '</button></td></tr>';
        }).join("") + '</tbody></table>') + '</section>';
    var err = function (j) { $("uerr").textContent = T.en["e_" + j.error] ? t("e_" + j.error) : t("e_server"); $("uerr").hidden = false; };
    $("uadd").addEventListener("click", function () {
      var btn = this; btn.disabled = true;
      api("usersave", { user: { name: $("un").value, username: $("uu").value, fin: $("uf").checked } }).then(function (j) {
        btn.disabled = false;
        if (!j.user) return err(j);
        S.users.push(j.user); S.pw = { u: j.user.username, p: j.password }; drawUsers();
      }).catch(function () { btn.disabled = false; });
    });
    $("main").querySelectorAll("[data-ufin]").forEach(function (el) {
      el.addEventListener("change", function () {
        var u = S.users.filter(function (x) { return x.id === el.getAttribute("data-ufin"); })[0];
        api("usersave", { user: { id: u.id, name: u.name, fin: el.checked } }).then(function (j) { if (j.user) { u.fin = j.user.fin; drawUsers(); } });
      });
    });
    $("main").querySelectorAll("[data-upw]").forEach(function (el) {
      el.addEventListener("click", function () {
        api("userreset", { id: el.getAttribute("data-upw") }).then(function (j) {
          if (!j.user) return;
          S.users.forEach(function (x, i) { if (x.id === j.user.id) S.users[i] = j.user; });
          S.pw = { u: j.user.username, p: j.password }; drawUsers(); window.scrollTo(0, 0);
        });
      });
    });
    $("main").querySelectorAll("[data-udel]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (!confirm(t("uDelQ"))) return;
        var id = el.getAttribute("data-udel");
        api("userdel", { id: id }).then(function (j) { if (j.ok) { S.users = S.users.filter(function (x) { return x.id !== id; }); S.pw = null; drawUsers(); } });
      });
    });
  }

  function load() {
    return api("me").then(function (j) {
      if (j.status === 501) S.down = true;
      S.me = j.signedIn ? j : null;
      draw();
    }).catch(function () { S.down = true; draw(); });
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { S.lang = b.getAttribute("data-lang"); try { localStorage.setItem("b2b-lang", S.lang); } catch (e) {} draw(); });
  });
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (!b) return; S.tab = b.getAttribute("data-tab"); if (S.tab === "list" || S.tab === "fin") S.list = null; S.done = ""; S.pw = null; draw(); });
  $("out").addEventListener("click", function () { api("logout", {}).then(function () { S.me = null; S.list = null; S.users = null; S.tab = "new"; draw(); }); });
  load();
})();
</script>
</body>
</html>
