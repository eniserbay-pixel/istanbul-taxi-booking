<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Yönetim · __BRAND__</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
:root { --black: #0b0b0c; --mustard: #e1ad01; --ice: #eaf4f8; --ice-2: #d5e9f1; --line: #d3dde3; --muted: #4b5761; --err: #b42318; --ok: #1d7a46; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--ice); color: #111; }
header { background: var(--black); color: #fff; border-bottom: 3px solid var(--mustard); }
.in { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header .in { display: flex; align-items: center; gap: 14px; min-height: 58px; }
.roof { background: var(--mustard); color: var(--black); font-size: 11px; font-weight: 900; letter-spacing: .14em; padding: 3px 7px; border-radius: 6px 6px 3px 3px; }
header b { font-size: 16px; }
header button { margin-left: auto; }
button, .b { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; background: #fff; color: #111; box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; display: inline-block; }
.y { background: var(--mustard); box-shadow: none; }
.k { background: var(--black); color: var(--mustard); box-shadow: none; }
.r { color: var(--err); }
button:disabled { opacity: .5; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
.tabs button.on { background: var(--black); color: var(--mustard); box-shadow: none; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; border-left: 6px solid var(--line); }
.card.request { border-left-color: var(--mustard); }
.card.confirmed { border-left-color: var(--ok); }
.card.declined, .card.cancelled { border-left-color: var(--err); opacity: .8; }
.head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.head .when { font-size: 18px; font-weight: 800; }
.st { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--ice); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 18px; margin: 10px 0; color: var(--muted); }
.grid b { color: #111; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.acts input { font: inherit; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 10px; min-width: 0; flex: 1 1 180px; }
.hist { font-size: 13px; color: var(--muted); margin-top: 8px; }
.login { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 14px; display: grid; gap: 12px; }
.login input { font: inherit; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; }
.msg { color: var(--err); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style></head>
<body>
<header><div class="in"><span class="roof">TAXI</span><b>__BRAND__ · Yönetim</b><button id="out" hidden>Çıkış</button></div></header>
<div class="in" id="app"></div>
<script>
var N = __NAMES__;
var LABEL = { request: "Talep", confirmed: "Onaylandı", declined: "Reddedildi", done: "Tamamlandı", cancelled: "İptal" };
var app = document.getElementById("app"), filter = "request", list = [];
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
function api(a, data) {
  return fetch("/api/admin?a=" + a, data ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } : {})
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Hata " + r.status); return j; }); });
}
function login(err) {
  document.getElementById("out").hidden = true;
  app.innerHTML = '<form class="login"><h2>Giriş</h2><input type="password" name="pw" placeholder="Şifre" autocomplete="current-password" required><button class="y">Giriş yap</button><p class="msg">' + esc(err || "") + "</p></form>";
  app.querySelector("form").onsubmit = function (e) {
    e.preventDefault();
    api("login", { password: this.pw.value }).then(load).catch(function (x) { login(x.message); });
  };
}
function load() {
  document.getElementById("out").hidden = false;
  return api("list").then(function (j) { list = j.bookings; draw(); }).catch(function (x) { if (/Giriş/.test(x.message)) login(); else app.innerHTML = '<p class="msg">' + esc(x.message) + "</p>"; });
}
function draw() {
  var counts = {}; list.forEach(function (b) { counts[b.status] = (counts[b.status] || 0) + 1; });
  var tabs = ["request", "confirmed", "done", "declined", "cancelled", "all"];
  // Upcoming first for open bookings, newest first for the rest
  var rows = list.filter(function (b) { return filter === "all" || b.status === filter; });
  if (filter === "request" || filter === "confirmed") rows.sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
  app.innerHTML = '<div class="tabs">' + tabs.map(function (t) { return '<button data-f="' + t + '" class="' + (t === filter ? "on" : "") + '">' + (t === "all" ? "Tümü" : LABEL[t]) + " (" + (t === "all" ? list.length : counts[t] || 0) + ")</button>"; }).join("") +
    '<button data-reload>Yenile</button></div>' + (rows.length ? rows.map(card).join("") : '<p class="empty">Kayıt yok</p>');
  app.querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () { filter = b.getAttribute("data-f"); draw(); }; });
  app.querySelector("[data-reload]").onclick = load;
  app.querySelectorAll("[data-act]").forEach(function (b) { b.onclick = function () { act(b); }; });
}
function card(b) {
  var z = function (id) { return N.zones[id] || id; };
  var wa = b.phone.replace(/[^0-9]/g, "");
  var acts = {
    request: '<button class="y" data-act="confirmed" data-id="' + b.id + '">Onayla ve mail gönder</button><button class="r" data-act="declined" data-id="' + b.id + '">Reddet</button>',
    confirmed: '<button class="k" data-act="done" data-id="' + b.id + '">Tamamlandı</button><button class="r" data-act="cancelled" data-id="' + b.id + '">İptal</button>',
    done: "", declined: "", cancelled: ""
  }[b.status];
  return '<div class="card ' + b.status + '"><div class="head"><span class="when">' + esc(b.date) + " " + esc(b.time) + "</span><b>" + esc(z(b.from)) + " → " + esc(z(b.to)) + '</b><span class="st">' + LABEL[b.status] + "</span><span>" + esc(b.ref) + "</span></div>" +
    '<div class="grid"><span>Araç: <b>' + esc(N.cars[b.car] || b.car) + "</b> · 👤 " + b.pax + " · 🧳 " + b.bags + (b.childSeats ? " · çocuk koltuğu " + b.childSeats : "") + "</span>" +
    "<span>Fiyat: <b>€" + b.price.total + "</b> · nakit</span>" +
    "<span>Müşteri: <b>" + esc(b.name) + '</b></span><span><a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + '</a> · <a href="https://wa.me/' + wa + '" target="_blank">WhatsApp</a></span><span>' + esc(b.email) + "</span>" +
    (b.flight ? "<span>Uçuş: <b>" + esc(b.flight) + "</b></span>" : "") + (b.pickup ? "<span>Alış: <b>" + esc(b.pickup) + "</b></span>" : "") + (b.dropoff ? "<span>Bırakış: <b>" + esc(b.dropoff) + "</b></span>" : "") +
    (b.ret ? "<span>Dönüş: <b>" + esc(b.ret.date) + " " + esc(b.ret.time) + "</b>" + (b.ret.flight ? " · " + esc(b.ret.flight) : "") + (b.ret.pickup ? " · " + esc(b.ret.pickup) : "") + "</span>" : "") +
    (b.note ? "<span>Not: <b>" + esc(b.note) + "</b></span>" : "") + "<span>Dil: " + b.lang.toUpperCase() + "</span></div>" +
    '<div class="acts">' + acts + '<input data-driver="' + b.id + '" placeholder="Şoför / plaka" value="' + esc(b.driver) + '"><input data-note="' + b.id + '" placeholder="İç not" value="' + esc(b.adminNote) + '"><button data-act="edit" data-id="' + b.id + '">Kaydet</button></div>' +
    '<div class="hist">' + b.history.map(function (h) { return esc(new Date(h.at).toLocaleString("tr-TR", { timeZone: "Europe/Istanbul" })) + " · " + esc(h.text); }).join("<br>") + "</div></div>";
}
function act(btn) {
  var id = +btn.getAttribute("data-id"), a = btn.getAttribute("data-act"), b = list.filter(function (x) { return x.id === id; })[0];
  var req;
  if (a === "edit") req = api("edit", { id: id, updatedAt: b.updatedAt, driver: app.querySelector('[data-driver="' + id + '"]').value, adminNote: app.querySelector('[data-note="' + id + '"]').value });
  else {
    var reason = "";
    if (a === "declined") { reason = prompt("Ret nedeni (müşteriye e-postada gider, boş bırakılabilir):", ""); if (reason === null) return; }
    else if (a === "confirmed" && !confirm("Onaylansın ve müşteriye onay e-postası gitsin mi?")) return;
    req = api("status", { id: id, updatedAt: b.updatedAt, status: a, reason: reason });
  }
  btn.disabled = true;
  req.then(function (j) { list = list.map(function (x) { return x.id === id ? j.booking : x; }); draw(); })
    .catch(function (x) { btn.disabled = false; alert(x.message); });
}
document.getElementById("out").onclick = function () { api("logout", {}).then(function () { login(); }); };
api("me").then(function (j) { j.signedIn ? load() : login(); }).catch(function (x) { app.innerHTML = '<p class="msg">' + esc(x.message) + "</p>"; });
</script>
</body></html>
