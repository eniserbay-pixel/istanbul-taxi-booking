<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Paneli | ITB Transfer</title>
<link rel="icon" href="/img/favicon-32.png">
<style>
:root {
  --side: #000000; --side-ink: #d6d6d6; --side-hi: #1c1c1c; --side-mute: #8a8a8a;
  --bg: #eaf4f8; --card: #fff; --ink: #111111; --mute: #5d6b72; --line: #d4e3ea;
  --blue: #8a6a00; --blue-soft: #fbf1cc; --accent: #e1ad01; --mustard: #e1ad01;
  --red: #dc2626; --red-soft: #fde8e8; --green: #16a34a; --green-soft: #e3f6ea;
  --purple: #7c3aed; --purple-soft: #f0e9ff; --amber: #b45309; --amber-soft: #fff3dc;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(1200px 400px at 100% -10%, color-mix(in srgb, var(--sec, #e1ad01) 9%, transparent), transparent 70%) var(--bg) fixed; color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
[hidden] { display: none !important; }

/* Layout */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { background: #000000; border-right: 4px solid var(--mustard); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; font-weight: 700; text-decoration: none; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--mustard); box-shadow: 0 4px 14px rgba(225, 173, 1, .35); display: grid; place-items: center; color: #1a1300; font-weight: 800; }
.brand small { display: block; font-weight: 400; color: var(--side-mute); font-size: 12px; }
.nav { padding: 6px 10px 14px; flex: 1; }
.nav h4 { margin: 18px 10px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); font-weight: 700; display: flex; align-items: center; gap: 7px; }
.nav h4::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); box-shadow: 0 0 10px var(--c); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-ink); text-decoration: none; transition: background .15s; }
.nav a:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }
.nav a.on { background: color-mix(in srgb, var(--c) 22%, transparent); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--c); }
.nav a svg { width: 17px; height: 17px; flex: none; color: var(--c); }
.nav a.off svg { opacity: .5; }
.nav a .soon { margin-left: auto; font-size: 10.5px; color: var(--side-mute); border: 1px solid #2a2c30; border-radius: 99px; padding: 0 7px; }
.nav a.off { color: var(--side-mute); }
.side-foot { padding: 12px 10px 16px; border-top: 1px solid #2a2c30; }
.side-foot button { width: 100%; text-align: left; background: none; border: 0; color: var(--side-ink); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.side-foot button:hover { background: var(--side-hi); }
.app > div { min-width: 0; border-top: 3px solid var(--sec, #e1ad01); }
.main h1 { display: flex; align-items: center; gap: 10px; }
.main h1::before { content: ""; flex: none; width: 5px; height: 22px; border-radius: 3px; background: var(--sec, #e1ad01); }
.main { min-width: 0; padding: 22px 28px 60px; }
/* top bar: on a computer only the Diller menu at the right; on a phone also the menu button */
.top { display: flex; justify-content: flex-end; align-items: center; padding: 14px 28px 0; }
.top > button, .top > b { display: none; }
.langs { position: relative; }
.langs summary { list-style: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink); }
.langs summary::-webkit-details-marker { display: none; }
.langs summary svg { width: 16px; height: 16px; }
.langs summary .code { font-size: 11.5px; color: var(--mute); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.langs .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 250px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(15, 23, 42, .14); padding: 6px; color: var(--ink); }
.langs .menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--mute); }
.langs .menu div { display: flex; align-items: center; border-radius: 7px; }
.langs .menu div:hover, .langs .menu div.on { background: var(--blue-soft); }
.langs .menu button { flex: 1; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 7px 8px; cursor: pointer; text-align: left; font-size: 13.5px; }
.langs .menu div.on button { color: var(--blue); font-weight: 600; }
.langs .menu button span { width: 26px; font-size: 11.5px; color: var(--mute); }
.langs .menu a { padding: 6px 9px; color: var(--mute); text-decoration: none; font-size: 13px; }
.langs .menu a:hover { color: var(--blue); }

h1 { font-size: 22px; margin: 0; }
.sub { color: var(--mute); margin: 2px 0 18px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.pad { padding: 16px 18px; }

/* Controls */
label.f { display: block; font-size: 12.5px; color: var(--mute); margin-bottom: 5px; font-weight: 500; }
.in { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: #fff; }
textarea.in { height: auto; padding: 9px 12px; resize: vertical; }
.in:focus { outline: 2px solid var(--blue-soft); border-color: var(--blue); }
.btn { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: #c9d0dc; }
.btn-p { background: var(--mustard); border-color: var(--mustard); color: #000; }
.btn-p:hover { background: #c99a00; border-color: #c99a00; }
.btn-s { height: 32px; padding: 0 11px; font-size: 13px; }
.btn-d { color: var(--red); }
.btn:disabled { opacity: .55; cursor: default; }
.chip { height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; }
.chip.on { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); font-weight: 600; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.search { display: flex; gap: 8px; }
.search .in { flex: 1; }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.chips .lab { color: var(--mute); font-size: 12.5px; }
/* Compact search and filter bar (Rezervasyonlar, Operasyonlar) */
.fbar { padding: 10px 14px; }
.frow { display: grid; grid-template-columns: minmax(180px, 2.2fr) repeat(4, minmax(110px, 1fr)) auto; gap: 8px; align-items: end; }
.fbar label.f { font-size: 11.5px; margin-bottom: 3px; }
.fbar .in { height: 34px; font-size: 13px; padding: 0 10px; }
.fbar .btn { height: 34px; padding: 0 14px; font-size: 13px; }
.fbar .chips { margin-top: 8px; gap: 6px; }
.fbar .chip { height: 26px; padding: 0 10px; font-size: 12px; }
.fbar .chip.clr { margin-left: auto; color: var(--mute); }
.err { background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.note { background: var(--amber-soft); color: #7a4a06; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.note code { background: #fff; padding: 1px 5px; border-radius: 4px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; margin: 16px 0; }
.stat { padding: 12px 14px; cursor: pointer; text-align: left; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--mute); font-size: 12.5px; }
.stat.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.row { cursor: pointer; }
td.ed:hover b { text-decoration: underline dotted; }
.ed-in { display: flex; flex-direction: column; gap: 4px; }
.ed-in .in { min-width: 130px; }
tr.row:hover td { background: #fafbfd; }
tr.row td:first-child { border-left: 3px solid transparent; }
tr.s-yeni td:first-child { border-left-color: var(--amber); }
tr.s-onaylandi td:first-child { border-left-color: var(--blue); }
tr.s-tamamlandi td:first-child { border-left-color: var(--purple); }
tr.s-iptal td:first-child { border-left-color: var(--red); }
tr.s-talep td:first-child { border-left-color: var(--accent); }
tr.s-degisiklik td:first-child { border-left-color: var(--purple); }
tr.s-reddedildi td:first-child { border-left-color: #9ca3af; }
.id { font-weight: 700; white-space: nowrap; }
.m { color: var(--mute); font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.route { max-width: 200px; }
.route div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.car { color: var(--blue); font-weight: 600; white-space: nowrap; }
td.src b { white-space: nowrap; font-weight: 600; }
td.src .m { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.pax { font-weight: 600; }
.price { font-weight: 700; white-space: nowrap; text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-yeni { background: var(--amber-soft); color: var(--amber); }
.p-onaylandi { background: var(--blue-soft); color: var(--blue); }
.p-tamamlandi { background: var(--purple-soft); color: var(--purple); }
.p-iptal { background: var(--red-soft); color: var(--red); }
.p-talep { background: #fff0c9; color: #92400e; }
.p-degisiklik { background: var(--purple-soft); color: var(--purple); }
.p-reddedildi { background: #eef0f3; color: #4b5563; }
.decide { background: #fffaf0; }
.decide .stbtns .btn { height: 38px; }
.btn-ok { background: var(--green); border-color: var(--green); color: #fff; }
.btn-ok:hover { background: #12873d; }
.prop { border: 1px dashed var(--purple); border-radius: 10px; padding: 10px 12px; margin-top: 10px; background: #fbf9ff; }
.nav a .cnt { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--amber); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.lead-alert { margin: 18px 28px 0; background: var(--amber-soft); color: #7a4a06; border: 1px solid #f3d29a; border-radius: 10px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.lead-alert b { color: var(--amber); }
.lead-alert .who { flex: 1; min-width: 220px; }
.lead-alert .who div { font-size: 13px; margin-top: 2px; }
@media (max-width: 820px) { .lead-alert { margin: 12px 16px 0; } }
select.lst { height: 34px; font-size: 13px; padding: 0 8px; min-width: 130px; }
select.lst.l-aranacak { border-color: var(--amber); background: var(--amber-soft); }
select.lst.l-arandi { border-color: var(--green); background: var(--green-soft); }
select.lst.l-ulasilamadi { border-color: var(--red); background: var(--red-soft); }
select.lst.l-yeni { border-color: var(--amber); background: var(--amber-soft); }
select.lst.l-anlasildi { border-color: var(--green); background: var(--green-soft); }
select.lst.l-olumsuz { border-color: var(--red); background: var(--red-soft); }
.apc-list { display: grid; gap: 12px; }
.apc { padding: 16px 18px; }
.apc-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; }
.apc-h h3 { margin: 0; font-size: 16px; }
.apc-h .tag { margin: 0 6px 0 0; }
.apc dl { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 6px 14px; margin: 12px 0; font-size: 13.5px; }
.apc dt { color: var(--mute); }
.apc dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.apc-f select.lst { width: auto; flex: none; }
.apc-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 640px) { .apc dl { grid-template-columns: 1fr; gap: 2px; } .apc dd { margin-bottom: 6px; } }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #eef1f5; color: var(--mute); margin-top: 4px; }
.mob-l { display: none; }
.acts { display: flex; gap: 4px; justify-content: flex-end; }
.ic { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none; display: grid; place-items: center; cursor: pointer; color: var(--mute); }
.ic:hover { background: #eef1f5; color: var(--ink); }
.ic svg { width: 17px; height: 17px; }
.ic.wa { color: #16a34a; }
.empty { padding: 40px; text-align: center; color: var(--mute); }
.bulk { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--blue-soft); border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; flex-wrap: wrap; }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--blue); }

/* Drawer */
.veil { position: fixed; inset: 0; background: rgba(15, 27, 45, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: #fff; z-index: 21; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,.12); }
.drawer header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 16px 20px; display: flex; align-items: center; gap: 12px; z-index: 1; }
.drawer header h2 { margin: 0; font-size: 18px; flex: 1; }
.drawer header .dh-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.drawer .h3-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.drawer .h3-row h3 { margin: 0; }
.drawer .trv-row { grid-template-columns: 1fr 1fr; }
.drawer .trv-row > div:first-child { grid-column: 1 / -1; }
/* Phone: the header's buttons go to their own row, so the title and the close button stay on screen */
@media (max-width: 640px) {
  .drawer header { flex-wrap: wrap; padding: 12px 16px; }
  .drawer header .dh-acts { order: 3; flex-basis: 100%; }
  .drawer section { padding: 14px 16px; }
  dl.kv { grid-template-columns: 110px 1fr; }
}
.drawer section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
dl.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; }
dl.kv dt { color: var(--mute); }
dl.kv dd { margin: 0; word-break: break-word; }
.leg { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.leg b.t { display: block; margin-bottom: 6px; }
.stbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.stbtns button.on { outline: 2px solid currentColor; }
.hist { margin: 0; padding: 0; list-style: none; }
.hist li { padding: 4px 0; color: var(--mute); font-size: 13px; }

/* Form */
.form section { margin-bottom: 16px; }
.form h2 { font-size: 15px; margin: 0 0 12px; }
.legbox { border-top: 1px dashed var(--line); padding-top: 14px; margin-top: 14px; }
.row-end { display: flex; justify-content: flex-end; gap: 10px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--side); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; }

/* Day groups (operations) */
.day { margin-bottom: 18px; }
.day h2 { font-size: 15px; margin: 0 0 8px; }
select.assign { height: 34px; min-width: 160px; max-width: 220px; font-size: 13px; padding: 0 8px; }
select.assign.on { border-color: var(--green); background: var(--green-soft); }
.asg { display: flex; align-items: center; gap: 4px; }
.fee { white-space: nowrap; text-align: right; }
.pt-lg { flex-wrap: wrap; }
.pt-lg > div:first-child { flex: 1 1 200px; min-width: 0; }
.pt-lg .acts { flex: none; margin: 0; }
.pt-lg .pw { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; }
.pt-lg .pw code { font-size: 15px; font-weight: 700; background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; letter-spacing: .04em; }
.pt-pr { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.bp-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 14px; }
.bp-form > div { min-width: 220px; }
.tl-in { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 13px; color: var(--mute); }
.tl-in .in { width: 96px; height: 34px; padding: 0 8px; text-align: right; font-weight: 700; }
.paid { color: var(--green); font-weight: 700; }
/* Operasyonlar: Tamamlandı button; a done transfer is greyed and its cash shows as collected */
.ic.dn.on { background: var(--green); border-color: var(--green); color: #fff; }
.ic.dn:not(.on) { border-color: var(--line); }
tr.row.isdone td { background: #f6fbf7; }
tr.row.isdone td.route, tr.row.isdone td.pn b { color: var(--mute); }
.got { color: var(--green); font-weight: 700; white-space: nowrap; }
/* Araç/Tedarik → Finans of a supplier */
.fin-b { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-height: 30px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 12.5px; color: var(--ink, #0b1d30); text-decoration: none; white-space: nowrap; }
.fin-b svg { width: 15px; height: 15px; }
.fin-b .bal { font-weight: 800; }
.fin-b .bal.pos { color: var(--red); } .fin-b .bal.neg { color: var(--green); }
.fin-k { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0 16px; }
.fin-zero { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin: 0 0 16px; }
.fin-zero .neg { color: var(--red); } .fin-zero .pos { color: var(--green); }
.fin-t td.n, .fin-t th.n { text-align: right; white-space: nowrap; }
.fin-t tr.closed td { color: var(--mute); }
@media (max-width: 820px) { .fin-k { grid-template-columns: 1fr; } }
.asg-q { height: 30px; margin-top: 5px; max-width: 220px; font-size: 12.5px; padding: 0 8px; }
/* Operasyonlar: compact so the whole table fits the screen; the date is on the day rows */
.ops-t th { padding: 9px 5px; white-space: normal; line-height: 1.25; vertical-align: bottom; }
.ops-t td { padding: 6px 5px; font-size: 13.5px; }
.ops-t .route { max-width: 150px; }
.ops-t .car { white-space: normal; min-width: 80px; }
.ops-t td.pn { max-width: 170px; overflow-wrap: anywhere; }
.ops-t .asg select.assign { width: 148px; min-width: 0; }
.ops-t .asg-q { max-width: 148px; }
.ops-t td.col { min-width: 64px; }
.ops-t .tl-in .in { width: 70px; }
.ops-t .acts { gap: 2px; }
.ops-t .ic { width: 28px; height: 28px; }
.ops-t .ic svg { width: 16px; height: 16px; }
.ops-t .opid { margin-top: 4px; display: flex; gap: 6px; align-items: center; justify-content: flex-end; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
tr.dayrow td { background: #eef2f8; font-weight: 700; padding: 9px 12px; }
.op { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.op:last-child { border-bottom: 0; }
.op:hover { background: #fafbfd; }
.op .tm { font-weight: 700; font-size: 16px; }

/* Pricing and vehicle types */
.h2 { font-size: 16px; margin: 0; }
.in-s { height: 34px; font-size: 13px; padding: 0 10px; max-width: 260px; }
.pk { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.pk-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.pk-off .pk-h { margin-bottom: 0; }
.pk-off .pk-b { display: none; }
.pk-cars { margin-top: 10px; }

  // The list shows one transfer per row: the first leg, or with a date filter on, each leg that falls in the range

  function srcPage(p) { return !p ? "" : p === "/" ? "ana sayfa" : /^\/[a-z]{2}$/.test(p) ? "ana sayfa (" + p.slice(1).toUpperCase() + ")" : p; }

  function closeDrawer() { $("drawer-wrap").hidden = true; document.body.style.overflow = ""; }

  function refresh() { if (S.view === "genel-bakis") viewHome(); else if (S.view === "rezervasyonlar") drawList(); else if (S.view === "operasyonlar") drawOps(); else if (S.view === "uetds") drawUetds(); else if (S.view === "musteriler") viewCustomers(); else if (S.view === "aranacaklar") viewLeads(); }

  // ---------- Genel Bakış: what needs the office today ----------
  // Read only. The counts use the same rules as the screens they link to (Bugün/Yarın = Operasyonlar with that
  // chip; Onay bekleyen = the number on Rezervasyonlar in the menu). With no booking saved yet a card says
  // "Henüz veri yok" instead of 0; the e-mail card says "Bağlantı gerekli" while RESEND_API_KEY is missing.
  function homeData() {
    var t = istDate(new Date()), tm = addDays(t, 1);
    var hm = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date());
    var soon = tm + " " + hm, weekAgo = new Date(Date.now() - 7 * 864e5).toISOString();
    var D = { today: [], tomorrow: [], unassigned: [], waiting: [], nocost: [], cash: [], mail: [], soon: 0, t: t };
    S.all.forEach(function (b) {
      if (b.status === "talep" || b.status === "degisiklik" || (b.status === "yeni" && b.source !== "manuel" && b.source !== "b2b")) D.waiting.push({ b: b, l: b.legs[0] || {} });
      (b.history || []).forEach(function (h) { if (h.at >= weekAgo && /gönderilemedi/.test(h.text)) D.mail.push({ b: b, h: h }); });
      if (b.status === "iptal") return;
      b.legs.forEach(function (l, i) {
        var x = { b: b, l: l, i: i };
        if (l.date === t) D.today.push(x);
        if (l.date === tm) D.tomorrow.push(x);
        if (b.status === "reddedildi") return;
        var done = legDone(b, l);
        if (l.date && l.date >= t && !done && !l.assign) { D.unassigned.push(x); if ((l.date + " " + l.time) <= soon) D.soon++; }
        if (l.assign && (l.assign.type === "acente" || l.assign.type === "bireysel") && !l.cost && !l.costTry) D.nocost.push(x);
        var c = l.date && l.date < t && !done && legCash(b, l);
        if (c) { x.c = c; D.cash.push(x); }
      });
    });
    var byTime = function (x, y) { return ((x.l.date || "") + (x.l.time || "")).localeCompare((y.l.date || "") + (y.l.time || "")); };
    [D.today, D.tomorrow, D.unassigned, D.nocost, D.cash].forEach(function (a) { a.sort(byTime); });
    D.waiting.sort(function (x, y) { return y.b.id - x.b.id; });
    D.mail.sort(function (x, y) { return y.h.at.localeCompare(x.h.at); });
    return D;
  }

      '<div class="ov-grid">' + [

        card({ h: "Onay bekleyen", c: "#e1ad01", list: D.waiting, sub: D.waiting.length ? "Siteden gelen talepler ve müşteri onayına gönderilen değişiklikler." : "Bekleyen talep yok.", go: "rezervasyonlar", goT: "Rezervasyonlar'a git →",

          line: function (x) { var a = created(x.h.at); return '<li><button type="button" data-open="' + x.b.id + '" title="' + esc(x.h.text) + '">' + a.date + ' ' + a.time + ' · #' + x.b.id + ' · ' + esc(x.h.text.replace(/ e-postası gönderilemedi.*$/, "")) + '</button></li>'; } })

  // ---------- Operations: upcoming transfers by day ----------
  // Operations: one row per transfer leg. Without a date filter it shows today onwards
  // (or everything with "Geçmişi de göster"); cancelled transfers only when Durum = İptal.
  var OPS_EMPTY = { q: "", svc: "", st: "", from: "", to: "", chip: "", all: false };
  S.of = S.of || Object.assign({}, OPS_EMPTY);
  function viewOps() {
    var f = S.of;
    $("main").innerHTML = '<div class="head"><div><h1>Operasyonlar</h1><p class="sub" id="opsub"></p></div><button type="button" class="btn" id="opsall">' + (f.all ? "Yaklaşanları göster" : "Geçmişi de göster") + '</button></div>' +
      filterCard(f) + '<div id="opsbody" style="margin-top:16px"></div>';
    bindFilters(f, drawOps, viewOps, function () { S.of = Object.assign({}, OPS_EMPTY); });
    $("opsall").addEventListener("click", function () { f.all = !f.all; viewOps(); });
    drawOps();
  }
  function drawOps() {
    var f = S.of, today = istDate(new Date()), ranged = !!(f.from || f.to);
    var legs = [];
    S.all.forEach(function (b) {
      if (f.st ? b.status !== f.st : b.status === "iptal") return;
      if (!matches(b, { q: f.q, svc: f.svc }, true)) return;
      b.legs.forEach(function (l, i) {
        if (!l.date) return;
        if (ranged ? (f.from && l.date < f.from) || (f.to && l.date > f.to) : !f.all && l.date < today) return;
        legs.push({ b: b, l: l, i: i, ret: b.legs.length > 1 && i === 1 });
      });
    });
    legs.sort(function (x, y) { return (x.l.date + x.l.time).localeCompare(y.l.date + y.l.time); });
    if (f.all && !ranged) legs.reverse();
    var days = {};
    legs.forEach(function (x) { (days[x.l.date] = days[x.l.date] || []).push(x); });
    var dayName = function (d) { return d === today ? "Bugün" : d === addDays(today, 1) ? "Yarın" : d === addDays(today, -1) ? "Dün" : weekday(d); };
    $("opsub").textContent = ranged ? "Seçilen tarihlerdeki transferler, saat sırasıyla." : f.all ? "Tüm transferler, en yeni tarih üstte." : "Bugünden itibaren yapılacak transferler, saat sırasıyla. İptaller gösterilmez.";
    $("opsbody").innerHTML = legs.length ? '<div class="card"><div class="tbl-wrap"><table class="ops-t"><thead><tr><th>Saat</th><th>Uçuş</th><th>Alış yeri</th><th>Bırakış yeri</th><th>Yolcu</th><th>Araç tipi</th><th style="text-align:right">Ücret</th><th>Şoför</th><th style="text-align:right" title="Tedarikçiye (acente, bireysel şoför) ödenecek tutar, günün kuruyla TL">Tedarik ödemesi</th><th>Tahsilat</th><th style="text-align:right">İşlem / ID</th></tr></thead><tbody>' +
        Object.keys(days).map(function (d) {
          return '<tr class="dayrow"><td colspan="11">' + dmy(d) + ' · ' + dayName(d) + ' <span class="m">(' + days[d].length + ' transfer)</span></td></tr>' + days[d].map(opRow).join("");
        }).join("") + '</tbody></table></div></div>' : '<div class="card empty">Bu filtrelere uyan transfer yok.</div>';
    // A click on the time cell waits a moment so that a double click can edit its date and time instead of opening the card
    var wait = null;
    document.querySelectorAll("#opsbody tr.row[data-id]").forEach(function (tr) {
      tr.addEventListener("click", function (e) {
        if (e.target.closest("a, select, input")) return;
        var id = +tr.getAttribute("data-id");
        clearTimeout(wait);
        if (e.target.closest("td[data-ed]")) wait = setTimeout(function () { openDrawer(id); }, 300); else openDrawer(id);
      });
    });
    document.querySelectorAll("#opsbody td[data-ed]").forEach(function (td) {
      td.addEventListener("dblclick", function (e) { e.preventDefault(); clearTimeout(wait); editOpCell(td); });
    });
    var assign = function (key, resId, label) {
      var k = key.split(":");
      return api("assign", { id: +k[0], leg: +k[1], resId: resId }).then(function (j) {
        upsert(j.booking); toast(resId ? "#" + k[0] + " atandı" + (label ? ": " + label : "") : "#" + k[0] + " ataması kaldırıldı"); drawOps();
      });
    };
    document.querySelectorAll("#opsbody select[data-assign]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        if (sel.value === "__new") { location.hash = "araclar"; return; }
        sel.disabled = true;
        assign(sel.getAttribute("data-assign"), sel.value).catch(function (e) { toast(e.message); sel.disabled = false; });
      });
    });
    // Tamamlandı: the transfer is done; when every leg of the booking is, the booking becomes Tamamlandı
    document.querySelectorAll("#opsbody [data-done]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var k = btn.getAttribute("data-done").split(":"), on = !btn.classList.contains("on");
        btn.disabled = true;
        api("done", { id: +k[0], leg: +k[1], done: on }).then(function (j) {
          upsert(j.booking); toast("#" + k[0] + (on ? " tamamlandı" : " tamamlandı işareti kaldırıldı")); drawOps();
        }).catch(function (e) { toast(e.message); btn.disabled = false; });
      });
    });
    // Tedarik Ödemesi: saved when the field is left or Enter is pressed
    document.querySelectorAll("#opsbody input[data-cost]").forEach(function (inp) {
      var was = inp.value;
      var save = function () {
        if (inp.value === was) return;
        var k = inp.getAttribute("data-cost").split(":");
        inp.disabled = true;
        api("cost", { id: +k[0], leg: +k[1], try: +inp.value || 0 }).then(function (j) {
          upsert(j.booking); was = inp.value; toast("#" + k[0] + " tedarik ödemesi kaydedildi"); inp.disabled = false;
        }).catch(function (e) { toast(e.message); inp.value = was; inp.disabled = false; });
      };
      inp.addEventListener("change", save);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } });
    });
    document.querySelectorAll("#opsbody input[data-q]").forEach(function (q) {
      var go = function (partial) {
        var m = matchRes(q.value, partial);
        if (m.length === 1) { q.disabled = true; assign(q.getAttribute("data-q"), m[0].id, m[0].label).catch(function (e) { toast(e.message); q.disabled = false; }); }
        else if (partial) toast(m.length ? "Birden fazla eşleşme var, devamını yazın: " + m.map(function (x) { return x.label; }).join(", ") : plateKey(q.value).length < 3 ? "Plakadan en az 3 karakter veya telefondan en az 4 rakam yazın" : "Bu plaka veya telefonla kayıtlı araç yok");
      };
      q.addEventListener("input", function () { go(false); });
      q.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(true); } });
    });
  }
  // Operasyonlar: double click on a leg's date or time edits it in place. Enter or leaving the field saves, Esc cancels.
  function editOpCell(td) {
    if (td.querySelector("input")) return;
    var k = td.getAttribute("data-key").split(":");
    var b = S.all.filter(function (x) { return x.id === +k[0]; })[0], i = +k[1];
    if (!b || !b.legs[i]) return;
    var oldD = b.legs[i].date || "", oldT = b.legs[i].time || "", done = false;
    td.innerHTML = '<div class="ed-in"><input class="in" type="date" value="' + esc(oldD) + '" aria-label="Tarih"><input class="in" type="time" value="' + esc(oldT) + '" aria-label="Saat"></div>';
    var ins = td.querySelectorAll("input"), di = ins[0], ti = ins[1];
    ti.focus();
    var finish = function (save) {
      if (done) return; done = true;
      var d = di.value, t = ti.value;
      if (!save || !d || !t || (d === oldD && t === oldT)) { drawOps(); return; }
      var copy = JSON.parse(JSON.stringify(b));
      copy.legs[i].date = d; copy.legs[i].time = t;
      if (copy.legs.length > 1 && copy.legs[1].date && copy.legs[0].date && (copy.legs[1].date + copy.legs[1].time) < (copy.legs[0].date + copy.legs[0].time)) {
        toast("Dönüş, gidişten önce olamaz"); drawOps(); return;
      }
      di.disabled = ti.disabled = true;
      api("update", { id: b.id, booking: copy }).then(function (j) {
        upsert(j.booking); toast("#" + b.id + " " + dmy(d) + " " + t + " olarak kaydedildi"); drawOps();
      }).catch(function (e) { toast(e.message); drawOps(); });
    };
    [di, ti].forEach(function (inp) {
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { e.preventDefault(); finish(false); }
      });
      // save when the focus leaves the cell, not when it moves between the two fields
      inp.addEventListener("blur", function (e) { if (!td.contains(e.relatedTarget)) setTimeout(function () { if (!td.contains(document.activeElement)) finish(true); }, 0); });
      inp.addEventListener("click", function (e) { e.stopPropagation(); });
    });
  }
  // One transfer leg in the operations table; same columns as the reservations list
  function opRow(x) {
    var b = x.b, l = x.l, wa = waLink(b);
    var pname = b.passenger && b.passenger.name || b.customer.name, pphone = b.passenger && b.passenger.phone || b.customer.phone;
    var price = l.price || (b.legs.length === 1 ? b.total : 0);
    var cell = function (code, name, addr, lbl) { var n = place(code, name); return '<td class="route" data-l="' + lbl + '"><div title="' + esc(n) + '">' + esc(n) + '</div>' + (addr ? '<div class="m">' + esc(addr) + '</div>' : '') + '</td>'; };
    var done = legDone(b, l);
    return '<tr class="row rc nock s-' + b.status + (done ? " isdone" : "") + '" data-id="' + b.id + '">' +
      '<td class="nowrap ed" data-l="Saat" data-ed="1" data-key="' + b.id + ':' + x.i + '" title="' + dmy(l.date) + ' · Çift tıklayın: tarih ve saati değiştir"><b>' + esc(l.time) + '</b>' + (x.ret ? '<div><span class="tag">Dönüş</span></div>' : '') + '</td>' +
      '<td class="nowrap" data-l="Uçuş">' + (l.flight ? '<b>' + esc(l.flight) + '</b>' : '<span class="m">-</span>') + '</td>' +
      cell(l.from, l.fromName, l.fromAddr, "Alınış") + cell(l.to, l.toName, l.toAddr, "Bırakılış") +
      '<td class="pn" data-l="Yolcu"><b>' + esc(pname) + '</b><div class="m nowrap sub"><span class="mob-l">Telefon</span>' + esc(pphone) + '</div>' + (l.note ? '<div class="m">Not: ' + esc(l.note) + '</div>' : '') + '</td>' +
      '<td class="car" data-l="Araç">' + esc(carName(b)) + '<div class="m sub" style="font-weight:400"><span class="mob-l">Kişi/valiz</span>' + l.pax + ' kişi · ' + l.bags + ' bavul</div></td>' +
      '<td class="price" data-l="Ücret">' + (price ? money(price, b.currency) : '<span class="m">-</span>') + '</td>' +
      '<td data-l="Şoför">' + assignCell(b, l, x.i) + '</td>' +
      '<td class="fee" data-l="Tedarik">' + supplierFee(b, Object.assign({ i: x.i }, l)) + '</td>' +
      '<td class="col" data-l="Tahsilat"><span>' + collect(b, price, l) + '</span></td>' +
      '<td class="act"><div class="acts"><button type="button" class="ic dn' + (done ? " on" : "") + '" data-done="' + b.id + ':' + x.i + '" title="' + (done ? "Tamamlandı (geri almak için tıklayın)" : "Tamamlandı olarak işaretle") + '" aria-pressed="' + done + '">' + svg("check") + '</button><button type="button" class="ic" title="Detay">' + svg("eye") + '</button><a class="ic" title="Düzenle" href="#duzenle/' + b.id + '">' + svg("edit") + '</a>' +
      (wa ? '<a class="ic wa" title="WhatsApp ile yaz" href="' + wa + '" target="_blank" rel="noopener">' + svg("wa") + '</a>' : '') + ueBtn(b, l, x.i) + '</div>' +
      '<div class="opid">#' + b.id + '<span class="pill p-' + b.status + '" style="font-size:11.5px;padding:1px 8px">' + STATUS[b.status] + '</span></div></td></tr>';
  }

  // Tahsilat: what is still to be collected from the customer. Card is paid online, so only "Ödendi";
  // otherwise the amount, its currency and how (Nakit / Havale).
  function collect(b, price, l) {
    if (b.payment === "kart") return '<span class="paid">Ödendi</span>';
    // a done transfer with a cash fare: the driver has it
    var c = l && legDone(b, l) && legCash(b, l);
    if (c) return '<span class="got">✓ ' + money(c.amt, c.cur) + '</span><div class="m">Nakit alındı</div>';
    // B2B: the cash the partner asked the driver to collect from its passenger on this transfer, else on account

  // The image is fitted onto a 760×356 canvas (the site's card shape, 2× for sharp screens) and uploaded as webp
  function uploadCarImage(file, el, c) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var W = 760, H = 356, cv = document.createElement("canvas"), k = Math.min(W / img.width, H / img.height);
      cv.width = W; cv.height = H;
      var w = img.width * k, h = img.height * k, ctx = cv.getContext("2d");
      ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      var data = cv.toDataURL("image/webp", 0.85);
      if (data.indexOf("data:image/webp") !== 0 || data.length > 580000) {
        var cv2 = document.createElement("canvas"); cv2.width = W; cv2.height = H;
        var c2 = cv2.getContext("2d"); c2.fillStyle = "#fff"; c2.fillRect(0, 0, W, H); c2.drawImage(cv, 0, 0);
        data = cv2.toDataURL("image/jpeg", 0.85);
      }
      el.querySelector(".vt-img").classList.add("busy");
      api("vimg", { data: data }).then(function (j) { c.img = j.url; drawCarTypes(); toast("Görsel yüklendi; kaydetmeyi unutmayın"); })
        .catch(function (e) { el.querySelector(".vt-img").classList.remove("busy"); toast(e.message); });
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast("Görsel açılamadı"); };
    img.src = url;
  }

  // ---------- Blog Yazıları: posts written here are drawn by api/blog.js and go live without a rebuild ----------
  var BL_TYPES = { p: "Paragraf", h2: "Ara başlık (H2)", h3: "Alt başlık (H3)", img: "Resim", ul: "Madde listesi", ol: "Numaralı liste", tip: "İpucu kutusu", table: "Tablo", transfer: "Transfer widgetı", hourly: "Şoförlü araç widgetı" };
  var BL_LANG = { en: "İngilizce", tr: "Türkçe", de: "Almanca", fr: "Fransızca", it: "İtalyanca", es: "İspanyolca", nl: "Felemenkçe", ro: "Rumence", ru: "Rusça", el: "Yunanca", sr: "Sırpça", ar: "Arapça" };
  var BL_ST = { pub: "Yayında", draft: "Taslak", sched: "Zamanlanmış" };
  function blUrl(p) { return (p.lang === "en" ? "" : "/" + p.lang) + "/blog/" + p.slug; }
  function blState(m) { return m.status !== "pub" ? "draft" : m.published > S.blog.today ? "sched" : "pub"; }
  function blDirty() { return !!S.bp && JSON.stringify(S.bp) !== S.bpOrig; }
  window.addEventListener("beforeunload", function (e) { if (blDirty()) { e.preventDefault(); e.returnValue = ""; } });
  function blSlug(s) {
    var map = { ç: "c", ğ: "g", ı: "i", İ: "i", ö: "o", ş: "s", ü: "u", Ç: "c", Ğ: "g", Ö: "o", Ş: "s", Ü: "u" };
    return String(s || "").replace(/[çğıİöşüÇĞÖŞÜ]/g, function (c) { return map[c]; }).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80).replace(/-+$/, "");
  }
  function blPlain(h) { var d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent || ""; }

  function viewBlog(parts) {
    var h = parts.join("/");
    if (parts[1] && S.bp && S.bpHash === h) return drawEditor();
    $("main").innerHTML = '<h1>Blog Yazıları</h1><p class="sub">Yükleniyor…</p>';
    var fail = function (e) { $("main").innerHTML = '<h1>Blog Yazıları</h1><div class="err">' + esc(e.message) + '</div>'; };
    api("blogs").then(function (j) {
      S.blog = j;
      if (!parts[1]) return drawBlogList();
      if (parts[1] === "yeni") {
        S.bp = { id: "", lang: "en", title: "", slug: "", status: "draft", published: j.today, updated: j.today, cat: "transport", hero: null, answer: "",
          blocks: [{ t: "p", h: "" }], faq: [], sources: [], seoTitle: "", desc: "", short: "", group: "" };
        S.bpOrig = JSON.stringify(S.bp); S.bpHash = h; S.slugAuto = true;
        return drawEditor();
      }
      return api("blog&id=" + encodeURIComponent(parts[1])).then(function (k) {
        S.bp = k.post; S.bpOrig = JSON.stringify(S.bp); S.bpHash = h; S.slugAuto = false;
        drawEditor();
      });
    }).catch(fail);
  }

  // Posts are written in English; their other-language versions share its group. The panel's Diller menu picks
  // which language the list shows: English lists the source posts with the languages each one is out in.
  function blGroups() {
    var g = {};
    S.blog.posts.forEach(function (m) { var k = m.group || m.id; (g[k] = g[k] || []).push(m); });
    return g;
  }
  function drawBlogList() {
    var B = S.blog, cat = {}, L = S.lang, groups = blGroups();
    B.site.cats.forEach(function (c) { cat[c.k] = c.tr; });
    // a post with no English version in its group still shows in the English list, so nothing goes missing
    var posts = B.posts.filter(function (m) {
      return L === "en" ? m.lang === "en" || !groups[m.group || m.id].some(function (x) { return x.lang === "en"; }) : m.lang === L;
    });
    var langCell = function (m) {
      if (m.lang !== "en") return '<td><span class="tag">' + esc(BL_LANG[m.lang] || m.lang) + '</span></td>';
      var v = groups[m.group || m.id].filter(function (x) { return x.lang !== "en"; });
      return '<td><div class="bl-lc">' + (v.length ? v.map(function (x) { var st = blState(x); return '<span class="pill p-' + st + '" title="' + esc(BL_LANG[x.lang] + ": " + BL_ST[st]) + '">' + x.lang.toUpperCase() + '</span>'; }).join("") : '<span class="m">Yalnız İngilizce</span>') + '</div></td>';
    };
    var rows = posts.map(function (m) {
      var st = blState(m);
      return '<tr class="row" data-id="' + esc(m.id) + '"><td><div class="ttl">' + esc(m.title) + '</div><div class="m">' + esc(blUrl(m)) + '</div></td>' +
        (L === "en" ? langCell(m) : '') + '<td>' + esc(cat[m.cat] || m.cat) + '</td>' +
        '<td><span class="pill p-' + st + '">' + BL_ST[st] + (st === "sched" ? " · " + dmy(m.published) : "") + '</span></td>' +
        '<td class="nowrap">' + dmy(m.updated) + '</td>' +
        '<td><div class="acts">' + (st === "pub" ? '<a class="ic" title="Sitede aç" target="_blank" rel="noopener" href="' + esc(blUrl(m)) + '">' + svg("eye") + '</a>' : '') +
        '<a class="ic" title="Düzenle" href="#blog/' + esc(m.id) + '">' + svg("edit") + '</a><button type="button" class="ic" title="Sil" data-del="' + esc(m.id) + '">' + svg("trash") + '</button></div></td></tr>';
    }).join("");
    var sub = L === "en" ? 'Yazılar İngilizce yazılır. Başka hangi dillerde yayınlanacağını yazının içindeki "Diğer dillerde yayınla" bölümünden seçin.'
      : esc(BL_LANG[L]) + ' sürümler. Yeni dil sürümü İngilizce yazının "Diğer dillerde yayınla" bölümünden eklenir.';
    // Content calendar: what is planned but not written yet. Written ones are in the list below as Zamanlanmış.
    var KIND = { "new": "Yeni yazı", translate: "Çeviri", edit: "Düzenleme" };
    var plan = (B.plan || []).filter(function (x) { return x.to >= B.today && (L === "en" || x.langs.indexOf(L) >= 0); });
    var planCard = plan.length ? '<div class="card pad bl-plan"><h3 class="bl-h">Takvimdeki planlı yazılar</h3><p class="bl-hint" style="margin:-4px 0 10px">Henüz yazılmadı. Yazıldıkça aşağıdaki listeye Zamanlanmış olarak, yayın tarihiyle eklenir.</p><ul>' +
      plan.map(function (x) {
        return '<li><span class="nowrap"><b>' + dmy(x.from) + '–' + dmy(x.to) + '</b></span> <span class="pill p-draft">' + KIND[x.kind] + '</span> ' + esc(x.title) +
          ' <span class="m">' + x.langs.map(function (l) { return l.toUpperCase(); }).join(", ") + (x.note ? ' · ' + esc(x.note) : '') + '</span></li>';
      }).join("") + '</ul></div>' : '';
    $("main").innerHTML = '<div class="head"><div><h1>Blog Yazıları' + (L === "en" ? '' : ' · ' + esc(BL_LANG[L])) + '</h1><p class="sub">' + sub + '</p></div>' +
      '<a class="btn btn-p" href="#blog/yeni">' + svg("plus").replace('<svg', '<svg width="16" height="16"') + 'Yeni yazı (İngilizce)</a></div>' + planCard +
      (posts.length ? '<div class="card tbl-wrap"><table class="bl-tbl"><thead><tr><th>Başlık</th>' + (L === "en" ? '<th>Diğer diller</th>' : '') + '<th>Kategori</th><th>Durum</th><th>Güncellenme</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : L !== "en" ? '<div class="card pad"><b>' + esc(BL_LANG[L]) + ' yazı yok.</b><p class="m" style="margin:4px 0 0">İngilizce bir yazıyı açın, "Diğer dillerde yayınla" bölümünde ' + esc(BL_LANG[L]) + '\'yı seçip yayınlayın.</p></div>'
        : '<div class="card pad"><b>Henüz yazı yok.</b><p class="m" style="margin:4px 0 0">"Yeni yazı" ile başlayın: başlık, kapak resmi, kısa cevap ve içerik bloklarını İngilizce doldurun, durumu Yayında yapıp Kaydet\'e basın.</p></div>');
    $("main").querySelectorAll("tr.row").forEach(function (tr) {
      tr.addEventListener("click", function (e) { if (!e.target.closest(".acts")) location.hash = "blog/" + tr.getAttribute("data-id"); });
    });
    $("main").querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del"), m = B.posts.find(function (x) { return x.id === id; });
        if (!confirm('"' + m.title + '" silinsin mi? Sitedeki sayfası da kalkar.')) return;
        api("blogdel", { id: id }).then(function () { B.posts = B.posts.filter(function (x) { return x.id !== id; }); toast("Silindi"); drawBlogList(); }).catch(function (e) { toast(e.message); });
      });
    });
  }

  // ----- editor -----
  function blTypeOpts(first) { return '<option value="">' + first + '</option>' + Object.keys(BL_TYPES).map(function (k) { return '<option value="' + k + '">' + BL_TYPES[k] + '</option>'; }).join(""); }
  function blNew(t) {
    return t === "p" || t === "tip" ? { t: t, h: "" } : t === "h2" || t === "h3" ? { t: t, x: "" } : t === "ul" || t === "ol" ? { t: t, items: [""] }
      : t === "img" ? { t: "img", src: "", alt: "", cap: "" } : t === "table" ? { t: "table", head: ["", ""], rows: [["", ""]] } : t === "transfer" ? { t: "transfer", a: "IST", b: "sultanahmet" } : { t: "hourly" };
  }
  function drawEditor() {
    var p = S.bp, B = S.blog, site = B.site;
    var opts = function (list, cur) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === cur ? " selected" : "") + '>' + esc(o[1]) + '</option>'; }).join(""); };
    var g = p.group || p.id, mates = B.posts.filter(function (m) { return g && m.id !== p.id && m.lang !== p.lang && (m.group || m.id) === g; });
    var sources = B.posts.filter(function (m) { return m.lang === "en"; });
    var src = p.lang !== "en" && B.posts.filter(function (m) { return m.lang === "en" && g && (m.group || m.id) === g; })[0];
    $("main").innerHTML = '<div class="head"><div><a href="#blog" class="m">← Blog Yazıları</a><h1>' + (p.id ? "Yazıyı düzenle" : "Yeni yazı") + '</h1></div></div>' +
      '<div class="bl-ed"><div class="bl-main">' +
      '<div class="card"><label class="f" for="bl-title">Başlık (H1)</label><input class="in bl-title" id="bl-title" maxlength="140" value="' + esc(p.title) + '" placeholder="Örn. Istanbul Airport to Taksim: every way to get there">' +
      '<label class="f" style="margin-top:12px">Kapak resmi <span class="m">(başlığın altında görünür, paylaşımlarda da bu resim çıkar; 1200×630 olarak ortadan kırpılır)</span></label>' +
      '<div class="bl-hero" id="bl-hero">' + (p.hero ? '<img src="' + esc(p.hero.small || p.hero.src) + '" alt="">' : 'Kapak resmi yok') + '</div>' +
      '<div class="vt-a"><label class="btn btn-s">' + (p.hero ? "Resmi değiştir" : "Resim yükle") + '<input type="file" accept="image/png,image/jpeg,image/webp" id="bl-herof" hidden></label>' +
      (p.hero ? '<button type="button" class="btn btn-s btn-d" id="bl-heronone">Kaldır</button>' : '') + '</div>' +
      (p.hero ? '<label class="f" for="bl-heroalt" style="margin-top:8px">Alt metin * <span class="m">(resimde ne görünüyor? Google ve görme engelli okurlar için)</span></label><input class="in" id="bl-heroalt" maxlength="200" value="' + esc(p.hero.alt) + '">' : '') +
      '</div>' +
      '<div class="card"><label class="f" for="bl-ans">Kısa cevap <span class="bl-cnt" id="bl-anscnt"></span></label><textarea class="in" id="bl-ans" rows="3" maxlength="700" placeholder="Okurun sorusuna 1-3 cümlelik net cevap. Google ve yapay zekâ asistanları çoğu zaman burayı alıntılar.">' + esc(p.answer) + '</textarea></div>' +
      '<div class="card"><h3 class="bl-h">İçerik</h3><p class="bl-hint" style="margin:-4px 0 10px">Fiyatı <b>{p:eco:IST:taksim}</b> gibi yazarsanız (araç tipi : nereden : nereye) sayfada Fiyatlandırma\'daki güncel fiyat görünür; fiyat değişince yazı kendiliğinden güncellenir.</p><div class="bl-list" id="bl-blocks"></div>' +
      '<div class="bl-add" style="margin-top:10px"><span>Sona ekle:</span>' + Object.keys(BL_TYPES).map(function (k) { return '<button type="button" class="btn btn-s" data-add="' + k + '">' + BL_TYPES[k] + '</button>'; }).join("") + '</div></div>' +
      '<div class="card"><h3 class="bl-h">Sık sorulan sorular</h3><p class="bl-hint" style="margin:-4px 0 10px">Önerilir: sayfanın altında görünür, Google ve yapay zekâ cevaplarında kullanılır.</p><div class="bl-list" id="bl-faq"></div><button type="button" class="btn btn-s" id="bl-faqadd" style="margin-top:8px">+ Soru ekle</button></div>' +
      '<div class="card"><h3 class="bl-h">Kaynaklar</h3><p class="bl-hint" style="margin:-4px 0 10px">Bilgiyi aldığınız resmi siteler (havalimanı, belediye, müze). Okura ve arama motorlarına güven verir.</p><div class="bl-list" id="bl-src"></div><button type="button" class="btn btn-s" id="bl-srcadd" style="margin-top:8px">+ Kaynak ekle</button></div>' +
      '</div><div class="bl-side">' +
      '<div class="card"><h3 class="bl-h">Yayın</h3><label class="f" for="bl-st">Durum</label><select class="in" id="bl-st">' + opts([["draft", "Taslak (sitede görünmez)"], ["pub", "Yayında"]], p.status) + '</select>' +
      '<div class="grid g2" style="margin-top:10px"><div><label class="f" for="bl-pub">Yayın tarihi</label><input class="in" type="date" id="bl-pub" value="' + esc(p.published) + '"></div>' +
      '<div><label class="f" for="bl-upd">Güncellenme</label><input class="in" type="date" id="bl-upd" value="' + esc(p.updated) + '"></div></div>' +
      '<button type="button" class="btn btn-s" id="bl-today" style="margin-top:8px">Bugün güncellendi</button><p class="bl-hint" id="bl-pubnote"></p>' +
      '<div class="bl-acts" style="margin-top:12px"><button type="button" class="btn" id="bl-prev">' + svg("eye").replace('<svg', '<svg width="16" height="16"') + 'Önizle</button><button type="button" class="btn btn-p" id="bl-save">Kaydet</button></div></div>' +
      '<div class="card"><h3 class="bl-h">Ayarlar</h3><div class="grid g2"><div><label class="f">Dil</label><div class="bl-lng">' + (p.lang === "en" ? 'İngilizce <span class="m">(ana dil)</span>' : esc(BL_LANG[p.lang] || p.lang) + ' <span class="m">(çeviri)</span>') + '</div></div>' +
      '<div><label class="f" for="bl-cat">Kategori</label><select class="in" id="bl-cat">' + opts(site.cats.map(function (c) { return [c.k, c.tr]; }), p.cat) + '</select></div></div>' +
      '<label class="f" style="margin-top:10px" for="bl-slug">Adres</label><div class="bl-slug"><span id="bl-pre"></span><input class="in" id="bl-slug" maxlength="90" value="' + esc(p.slug) + '"></div><p class="bl-hint" id="bl-slugnote"></p>' +
      '<label class="f" style="margin-top:10px" for="bl-short">Kısa ad <span class="m">(sayfa yolunda ve ilgili yazı bağlantılarında)</span></label><input class="in" id="bl-short" maxlength="60" value="' + esc(p.short) + '" placeholder="Boş kalırsa başlık kullanılır">' +
      (p.lang !== "en" ? '<label class="f" style="margin-top:10px" for="bl-grp">İngilizce aslı</label><select class="in" id="bl-grp"><option value="">Yok</option>' + opts(sources.map(function (m) { return [m.id, m.title]; }), src ? src.id : "") + '</select>' +
      (src ? '<p class="bl-hint"><a href="#blog/' + esc(src.id) + '">İngilizce yazıya git →</a></p>' : '<p class="bl-hint">Bu çeviriyi İngilizce yazısına bağlayın; Google her okura kendi dilindekini gösterir.</p>') : '') + '</div>' +
      (p.lang === "en" ? blTransCard(p, mates, site) : '') +
      '<div class="card"><h3 class="bl-h">SEO</h3><label class="f" for="bl-seot">SEO başlığı <span class="bl-cnt" id="bl-seotc"></span></label><input class="in" id="bl-seot" maxlength="80" value="' + esc(p.seoTitle) + '" placeholder="Boş kalırsa başlık kullanılır">' +
      '<label class="f" for="bl-desc" style="margin-top:10px">Açıklama <span class="bl-cnt" id="bl-descc"></span></label><textarea class="in" id="bl-desc" rows="3" maxlength="220" placeholder="Google sonuçlarında başlığın altında görünen 1-2 cümle">' + esc(p.desc) + '</textarea>' +
      '<div class="bl-serp" id="bl-serp"></div><h3 class="bl-h" style="margin-top:14px">Kontrol listesi</h3><ul class="bl-chk" id="bl-chk"></ul></div>' +
      '</div></div>';

    var val = function (id, f) { $(id).addEventListener("input", function () { f(this.value); paintSeo(); }); };
    val("bl-title", function (v) { p.title = v; if (S.slugAuto) { p.slug = blSlug(v); $("bl-slug").value = p.slug; } });
    val("bl-ans", function (v) { p.answer = v; });
    val("bl-slug", function (v) { S.slugAuto = !v; p.slug = blSlug(v) === v ? v : v.toLowerCase(); });
    $("bl-slug").addEventListener("change", function () { p.slug = blSlug(this.value); this.value = p.slug; paintSeo(); });
    val("bl-short", function (v) { p.short = v; });
    val("bl-seot", function (v) { p.seoTitle = v; });
    val("bl-desc", function (v) { p.desc = v; });
    val("bl-pub", function (v) { p.published = v; if (p.updated < v) { p.updated = v; $("bl-upd").value = v; } });
    val("bl-upd", function (v) { p.updated = v; });
    $("bl-today").addEventListener("click", function () { p.updated = S.blog.today; $("bl-upd").value = p.updated; paintSeo(); });
    $("bl-st").addEventListener("change", function () { p.status = this.value; paintSeo(); });
    $("bl-cat").addEventListener("change", function () { p.cat = this.value; });
    if ($("bl-grp")) $("bl-grp").addEventListener("change", function () {
      var id = this.value, m = B.posts.find(function (x) { return x.id === id; });
      p.group = m ? (m.group || m.id) : "";
    });
    if ($("bl-trgo")) $("bl-trgo").addEventListener("click", blTranslate);
    if ($("bl-trall")) $("bl-trall").addEventListener("click", function () {
      var bx = document.querySelectorAll(".bl-trl input:not(:disabled)"), all = [].every.call(bx, function (x) { return x.checked; });
      bx.forEach(function (x) { x.checked = !all; }); this.textContent = all ? "Tümünü seç" : "Seçimi kaldır";
    });
    $("bl-herof").addEventListener("change", function () {
      var f = this.files[0]; if (!f) return;
      $("bl-hero").classList.add("busy");
      blPic(f, true).then(function (im) { im.alt = p.hero && p.hero.alt || ""; p.hero = im; drawEditor(); toast("Kapak resmi yüklendi; kaydetmeyi unutmayın"); if ($("bl-heroalt") && !im.alt) $("bl-heroalt").focus(); })
        .catch(function (e) { $("bl-hero").classList.remove("busy"); toast(e.message); });
    });
    if ($("bl-heronone")) $("bl-heronone").addEventListener("click", function () { p.hero = null; drawEditor(); });
    if ($("bl-heroalt")) val("bl-heroalt", function (v) { p.hero.alt = v; });
    $("main").querySelectorAll("[data-add]").forEach(function (b) {
      b.addEventListener("click", function () { p.blocks.push(blNew(b.getAttribute("data-add"))); drawBlocks(p.blocks.length - 1); });
    });
    $("bl-faqadd").addEventListener("click", function () { p.faq.push({ q: "", a: "" }); drawPairs(); });
    $("bl-srcadd").addEventListener("click", function () { p.sources.push({ n: "", u: "" }); drawPairs(); });
    $("bl-save").addEventListener("click", blSave);
    $("bl-prev").addEventListener("click", blPreview);
    drawBlocks(); drawPairs(); paintSeo();
  }

  function paintSeo() {
    var p = S.bp, B = S.blog;
    var cnt = function (id, n, lo, hi) { var e = $(id); e.textContent = n + (hi ? " / " + lo + "–" + hi : ""); e.className = "bl-cnt" + (hi ? (n >= lo && n <= hi ? " ok" : n ? " bad" : "") : ""); };
    var title = p.seoTitle || (p.title.length < 45 ? p.title + " | ITB Transfer" : p.title);
    cnt("bl-seotc", title.length, 30, 65); cnt("bl-descc", p.desc.length, 120, 160); cnt("bl-anscnt", p.answer.length);
    $("bl-pre").textContent = (p.lang === "en" ? "" : "/" + p.lang) + "/blog/";
    $("bl-serp").innerHTML = '<small>istanbultaxibooking.com › ' + (p.lang === "en" ? "" : p.lang + " › ") + 'blog › ' + esc(p.slug || "…") + '</small><b>' + esc(title || "Başlık") + '</b><p>' + esc(p.desc || "Açıklama yazın…") + '</p>';
    var live = p.status === "pub" && p.published <= B.today;
    $("bl-pubnote").innerHTML = p.status !== "pub" ? "Taslak: sitede görünmez. Yayınlamak için durumu Yayında yapıp kaydedin."
      : p.published > B.today ? "Yazı " + dmy(p.published) + " tarihinde kendiliğinden yayına girer."
      : S.bpOrig && JSON.parse(S.bpOrig).status === "pub" && p.id ? 'Sitede: <a href="' + esc(blUrl(JSON.parse(S.bpOrig))) + '" target="_blank" rel="noopener">' + esc(blUrl(JSON.parse(S.bpOrig))) + '</a>' : "Kaydedince sitede yayına girer.";
    $("bl-slugnote").textContent = p.id && JSON.parse(S.bpOrig).status === "pub" && JSON.parse(S.bpOrig).slug !== p.slug ? "Dikkat: yayındaki yazının adresini değiştirmek eski bağlantıları bozar." : "";
    // what the page will need to rank and be quoted
    var html = p.blocks.map(function (b) { return b.h || (b.items || []).join(" ") || b.cap || (b.t === "table" ? b.head.concat.apply(b.head, b.rows).join(" ") : ""); }).join(" ") + p.faq.map(function (f) { return f.a; }).join(" ");
    var internal = (html.match(/href="\/(?!\/)/g) || []).length, external = (html.match(/href="https?:/g) || []).length + p.sources.filter(function (s) { return s.u; }).length;

  // pictures: the cover is cropped to 1200×630 (+ an 800 px copy for phones and cards), others are fitted to 1600 px wide (+ 800 px)
  function blPic(file, cover) {
    return new Promise(function (ok, no) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onerror = function () { URL.revokeObjectURL(url); no(new Error("Görsel açılamadı")); };
      img.onload = function () {
        URL.revokeObjectURL(url);
        var draw = function (W, H) {
          var cv = document.createElement("canvas"), x = cv.getContext("2d");
          cv.width = W; cv.height = H; x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
          if (cover) { var k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k; x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); }
          else x.drawImage(img, 0, 0, W, H);
          for (var q = 0.82; q > 0.4; q -= 0.12) {
            var d = cv.toDataURL("image/webp", q);
            if (d.indexOf("data:image/webp") !== 0) d = cv.toDataURL("image/jpeg", q);
            if (d.length < 900000) return d;
          }
          throw new Error("Görsel çok büyük");
        };
        var W = cover ? 1200 : Math.min(1600, img.width), H = cover ? 630 : Math.round(img.height * W / img.width);
        var w2 = Math.min(800, W), h2 = Math.round(H * w2 / W);
        try { var big = draw(W, H), small = w2 < W ? draw(w2, h2) : null; } catch (e) { return no(e); }
        // two uploads in order: the large one, then the small one
        api("bimg", { data: big }).then(function (a) {
          return (small ? api("bimg", { data: small }) : Promise.resolve({ url: a.url })).then(function (b) { ok({ src: a.url, small: b.url, w: W, h: H }); });
        }).catch(no);
      };
      img.src = url;
    });
  }

  function zip(files) {
    var enc = new TextEncoder(), parts = [], central = [], off = 0;
    var crcT = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crcT[n] = c >>> 0; }

  // Images are made smaller (longest side 2000 px, JPEG) so a few tickets fit in one request; PDFs go as they are.
  function afRead(file) {
    return new Promise(function (ok, no) {
      if (file.type === "application/pdf") {
        if (file.size > 2400000) return no(new Error(file.name + ": PDF en fazla 2,4 MB olabilir"));
        var r = new FileReader();
        r.onload = function () { ok({ type: "application/pdf", name: file.name, data: String(r.result).split(",")[1] }); };
        r.onerror = function () { no(new Error(file.name + " okunamadı")); };
        return r.readAsDataURL(file);
      }
      if (!/^image\//.test(file.type)) return no(new Error(file.name + ": sadece resim veya PDF eklenebilir"));
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 2000 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        var x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        ok({ type: "image/jpeg", name: file.name || "görsel", data: cv.toDataURL("image/jpeg", 0.85).split(",")[1] });
      };
      img.onerror = function () { URL.revokeObjectURL(url); no(new Error((file.name || "Görsel") + " açılamadı (HEIC ise ekran görüntüsü alıp ekleyin)")); };
      img.src = url;
    });
  }

      var pl = function (k) { var c = v(k + "Sel"); return c === "__other" ? { code: "", name: v(k + "Name") } : { code: c, name: c ? PLACES[c] : "" }; };
      var leg = function (p) {
        var f = pl(p + "from"), t = pl(p + "to");
        return { date: v(p + "date"), time: v(p + "time"), flight: v(p + "flight"), price: v(p + "price"), cost: v(p + "cost"),
          from: f.code, fromName: f.name, fromAddr: v(p + "fromAddr"),
          to: t.code, toName: t.name, toAddr: v(p + "toAddr"),
          pax: v(p + "pax"), bags: v(p + "bags"), seatB: v(p + "seatB"), seatK: v(p + "seatK"), note: v(p + "note"),
          assign: (edit || offer) && b.legs[p === "a_" ? 0 : 1] ? b.legs[p === "a_" ? 0 : 1].assign || null : null,
          uetds: (edit || offer) && b.legs[p === "a_" ? 0 : 1] ? b.legs[p === "a_" ? 0 : 1].uetds || null : null,
          cash: (edit || offer) && b.legs[p === "a_" ? 0 : 1] ? b.legs[p === "a_" ? 0 : 1].cash || 0 : 0,
          done: edit && b.legs[p === "a_" ? 0 : 1] ? b.legs[p === "a_" ? 0 : 1].done || "" : "" };
      };
      var data = Object.assign({}, edit || offer ? b : {}, {
        status: v("status"), lang: v("lang"), car: v("car"), carName: CARS[v("car")],
        customer: { name: v("cname"), phone: v("cphone"), email: v("cemail") },
        passenger: { name: v("pname"), phone: v("pphone") },
        travelers: offer ? b.travelers || [] : readTrav(form),
        legs: $("hasret").checked ? [leg("a_"), leg("b_")] : [leg("a_")],
        total: v("total"), currency: v("currency"), payment: v("payment"), adminNote: v("adminNote"), partner: v("partner")
      });
      var err = [];
      if (!data.customer.name) err.push("Müşteri adı gerekli");
      if (!data.customer.phone && !data.customer.email) err.push("Telefon veya e-posta gerekli");
      data.legs.forEach(function (l, i) { var n = data.legs.length > 1 ? (i ? " (dönüş)" : " (gidiş)") : ""; if (!l.date || !l.time) err.push("Tarih ve saat gerekli" + n); if (!l.fromName || !l.toName) err.push("Alış ve bırakış yeri gerekli" + n); });
      if (data.legs[1] && data.legs[1].date && data.legs[1].date < data.legs[0].date) err.push("Dönüş tarihi gidişten önce olamaz");
      if (err.length) { $("ferr").textContent = err.join(", "); $("ferr").hidden = false; return; }
      $("ferr").hidden = true;
      var btn = form.querySelector(".btn-p"); btn.disabled = true;
      if (offer && !confirm("Değişiklik " + (b.customer.email || "müşteriye") + " adresine onaya gönderilsin mi?")) { btn.disabled = false; return; }
      (offer ? api("propose", { id: b.id, booking: data, message: $("offermsg").value.trim() }) : edit ? api("update", { id: b.id, booking: data }) : api("create", { booking: data, lead: lead ? lead.id : undefined })).then(function (j) {
        upsert(j.booking);
        if (lead) S.leads = S.leads.filter(function (x) { return x.id !== lead.id; });
        toast(offer ? "#" + j.booking.id + " değişiklik müşteriye gönderildi" : edit ? "#" + j.booking.id + " kaydedildi" : "#" + j.booking.id + " eklendi");
        location.hash = b ? back() : "rezervasyonlar";
        setTimeout(function () { openDrawer(j.booking.id); }, 50);
      }).catch(function (e) { $("ferr").textContent = e.message; $("ferr").hidden = false; btn.disabled = false; });
    });
  }
})();
</script>
</body>
</html>
